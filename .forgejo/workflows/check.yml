name: Check SPARQL queries
permissions:
  contents: read
on: [push, pull_request, workflow_call, workflow_dispatch]

jobs:

  check:
    name: Run SPARQL checks
    runs-on: codeberg-small

    steps:
    - uses: https://github.com/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - uses: https://github.com/actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install tester
      run: wget "https://github.com/sib-swiss/sparql-examples-utils/releases/download/v2.0.23/sparql-examples-utils-2.0.23-uber.jar" -O sparql-examples-utils.jar

    - name: Check JVM stack size
      run: java -XX:+PrintFlagsFinal -version 2>&1 | grep ThreadStackSize

    # Had to increase JVM stack
    - name: Run tests
      run: java -Xss8m -jar sparql-examples-utils.jar test --input-directory=examples/
